<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San Valentín</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #c9a96e;
            --cream: #f5f0e8;
            --rose: #8b2942;
            --rose-light: #ff6b8a;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(180deg, #0a0a0a 0%, #151515 50%, #0a0a0a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            font-size: 24px;
            opacity: 0;
            animation: floatParticle 12s infinite ease-in-out;
        }

        @keyframes floatParticle {
            0% { opacity: 0; transform: translateY(100vh) rotate(0deg) scale(0.5); }
            10% { opacity: 0.9; }
            90% { opacity: 0.9; }
            100% { opacity: 0; transform: translateY(-10vh) rotate(360deg) scale(1); }
        }

        /* Main container */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        /* Question */
        .question {
            font-family: 'Georgia', serif;
            font-size: clamp(2rem, 6vw, 3rem);
            color: var(--cream);
            margin-bottom: 30px;
            text-align: center;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Rose Emoji - Real look */
        .main-rose {
            font-size: 120px;
            margin: 20px 0;
            animation: floatRose 4s ease-in-out infinite;
            filter: drop-shadow(0 10px 30px rgba(139, 41, 66, 0.4));
        }

        @keyframes floatRose {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-20px) rotate(3deg); }
        }

        /* Decorative roses */
        .roses-decoration {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            font-size: 40px;
        }

        .rose-dec {
            animation: floatRose 3s ease-in-out infinite;
        }

        .rose-dec:nth-child(2) { animation-delay: 0.5s; }
        .rose-dec:nth-child(3) { animation-delay: 1s; }

        /* Buttons */
        .buttons {
            display: flex;
            gap: 25px;
            margin-top: 40px;
            animation: fadeInUp 1s ease-out 0.5s both;
        }

        .btn {
            padding: 18px 50px;
            font-size: 1.1rem;
            font-family: 'Georgia', serif;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-style: italic;
        }

        .btn-yes {
            background: linear-gradient(135deg, var(--rose), var(--rose-light));
            color: white;
            border: none;
            box-shadow: 0 10px 40px rgba(139, 41, 66, 0.4);
        }

        .btn-yes:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 60px rgba(139, 41, 66, 0.6);
        }

        .btn-no {
            background: transparent;
            color: var(--cream);
            border: 1px solid var(--gold);
        }

        .btn-no:hover {
            background: rgba(201, 169, 110, 0.1);
            transform: translateY(-3px);
        }

        /* Flowers Screen */
        .flowers-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0a0a0a 0%, #151515 100%);
            z-index: 100;
            overflow: hidden;
        }

        .flowers-screen.show {
            display: block;
            animation: fadeInScreen 1s ease-out;
        }

        @keyframes fadeInScreen {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Real flowers */
        .real-flower {
            position: absolute;
            font-size: 60px;
            opacity: 0;
            transform: scale(0) rotate(0deg);
            animation: realFlowerBloom 6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes realFlowerBloom {
            0% { opacity: 0; transform: scale(0) rotate(-180deg); }
            20% { opacity: 1; transform: scale(1.3) rotate(0deg); }
            40% { transform: scale(1) rotate(5deg); }
            60% { transform: scale(1.15) rotate(-5deg); }
            80% { transform: scale(1.05) rotate(3deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        /* Floating flowers after bloom */
        .flower-float {
            position: absolute;
            font-size: 35px;
            opacity: 0.9;
            animation: flowerFloat 8s infinite ease-in-out;
        }

        @keyframes flowerFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(10deg); }
            50% { transform: translateY(0) rotate(-5deg); }
            75% { transform: translateY(-15px) rotate(5deg); }
        }

        /* Magic sparkles */
        .magic-sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #fff 0%, var(--gold) 50%, transparent 100%);
            border-radius: 50%;
            animation: magicSparkle 2s infinite ease-in-out;
        }

        @keyframes magicSparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1.5); box-shadow: 0 0 20px #fff, 0 0 40px var(--gold); }
        }

        /* Petals falling */
        .petal {
            position: absolute;
            font-size: 20px;
            animation: petalFall 6s ease-in-out infinite;
            opacity: 0.8;
        }

        @keyframes petalFall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* Error Screen */
        .error-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0000 0%, #4a0000 50%, #1a0000 100%);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .error-screen.show {
            display: flex;
        }

        .error-content {
            text-align: center;
            padding: 20px;
        }

        .error-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: shakeIcon 0.5s infinite;
        }

        @keyframes shakeIcon {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .error-title {
            font-family: 'Georgia', serif;
            font-size: clamp(1.2rem, 4vw, 2rem);
            color: #ff6666;
            margin-bottom: 30px;
            line-height: 1.6;
            max-width: 400px;
        }

        .countdown-container {
            margin: 30px 0;
        }

        .countdown-label {
            font-family: 'Georgia', serif;
            font-size: clamp(1.5rem, 5vw, 3rem);
            color: #ff4444;
            animation: countdownPulse 1s ease-in-out infinite;
        }

        @keyframes countdownPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Explosion effects */
        .explosion {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 200;
            display: none;
        }

        .explosion.show {
            display: block;
            animation: explosionFade 0.5s ease-out forwards;
        }

        @keyframes explosionFade {
            0% { opacity: 1; background: radial-gradient(circle, #ff0000 0%, #ff6600 30%, #ffaa00 60%, transparent 70%); }
            50% { opacity: 1; background: radial-gradient(circle, #ff4400 0%, #ff8800 40%, transparent 70%); }
            100% { opacity: 0; background: radial-gradient(circle, #ff2200 0%, #ff6600 50%, transparent 80%); }
        }

        .explosion-particle {
            position: absolute;
            font-size: 30px;
            animation: explodeParticle 1s ease-out forwards;
        }

        @keyframes explodeParticle {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
        }

        .shake {
            animation: shakeScreen 0.5s ease-in-out;
        }

        @keyframes shakeScreen {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-10px, -10px); }
            20% { transform: translate(10px, -10px); }
            30% { transform: translate(-10px, 10px); }
            40% { transform: translate(10px, 10px); }
            50% { transform: translate(-5px, -5px); }
            60% { transform: translate(5px, -5px); }
            70% { transform: translate(-5px, 5px); }
            80% { transform: translate(5px, 5px); }
            90% { transform: translate(-2px, -2px); }
        }

        /* Share buttons */
        .share-section {
            margin-top: 40px;
            text-align: center;
            z-index: 200;
        }

        .share-text {
            color: var(--cream);
            font-family: 'Georgia', serif;
            font-size: 1.1rem;
            margin-bottom: 15px;
            opacity: 0;
            animation: fadeInUp 1s ease-out 2s forwards;
        }

        .share-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeInUp 1s ease-out 2.5s forwards;
        }

        .btn-share {
            padding: 12px 30px;
            font-size: 1rem;
            font-family: 'Georgia', serif;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-share-yes {
            background: linear-gradient(135deg, var(--rose), var(--rose-light));
            color: white;
            border: none;
        }

        .btn-share-yes:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(139, 41, 66, 0.5);
        }

        .btn-share-no {
            background: rgba(255, 255, 255, 0.1);
            color: var(--cream);
            border: 1px solid var(--gold);
        }

        .btn-share-no:hover {
            background: rgba(201, 169, 110, 0.2);
            transform: scale(1.05);
        }

        /* Response indicator */
        .response-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: var(--cream);
            padding: 10px 20px;
            border-radius: 20px;
            font-family: 'Georgia', serif;
            font-size: 0.9rem;
            z-index: 1000;
            display: none;
            border: 1px solid var(--gold);
        }

        .response-indicator.show {
            display: block;
            animation: fadeInUp 0.5s ease-out;
        }

        .response-indicator.yes {
            border-color: var(--rose);
            color: var(--rose-light);
        }

        .response-indicator.no {
            border-color: #ff4444;
            color: #ff6666;
        }

        /* Back button */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--cream);
            border: 1px solid var(--gold);
            padding: 10px 20px;
            border-radius: 20px;
            font-family: 'Georgia', serif;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
            display: none;
        }

        .back-btn.show {
            display: block;
            animation: fadeInUp 0.5s ease-out;
        }

        .back-btn:hover {
            background: rgba(201, 169, 110, 0.2);
        }

        /* Mobile */
        @media (max-width: 600px) {
            .container { padding: 15px; }
            .main-rose { font-size: 90px; }
            .roses-decoration { font-size: 30px; gap: 10px; }
            .buttons { gap: 15px; flex-direction: column; }
            .btn { padding: 15px 40px; }
        }
    </style>
</head>
<body>
    <!-- Particles -->
    <div class="particles" id="particles"></div>

    <!-- Main Screen -->
    <div class="container" id="mainScreen">
        <p class="question">Edna, ¿quieres ser mi Valentine?</p>
        
        <div class="roses-decoration">
            <span class="rose-dec">🌹</span>
            <span class="main-rose">🌹</span>
            <span class="rose-dec">🌹</span>
        </div>
        
        <div class="buttons">
            <button class="btn btn-yes" onclick="sayYes()">Sí</button>
        <button class="btn btn-no" onclick="sayNo()">No</button>
        </div>
    </div>

    <!-- Flowers Screen -->
    <div class="flowers-screen" id="flowersScreen">
        <div id="flowersContainer"></div>
        <div id="floatContainer"></div>
        <div id="sparkleContainer"></div>
        <div id="petalContainer"></div>
    </div>

    <!-- Error Screen -->
    <div class="error-screen" id="errorScreen">
        <div class="error-content">
            <div class="error-icon">⚠️</div>
            <h1 class="error-title">Tu dispositivo se autodestruira<br>en 10 segundos 💥</h1>
            <div class="countdown-container">
                <div class="countdown-label" id="countdown">10</div>
                <p style="color: #ff8888; font-family: Georgia, serif; margin-top: 10px;">se autodestruira en <span id="secLabel">secs</span></p>
            </div>
        </div>
    </div>

    <!-- Explosion overlay -->
    <div class="explosion" id="explosion"></div>

    <!-- Response indicator (shows who responded via link) -->
    <div class="response-indicator" id="responseIndicator"></div>

    <!-- Back button -->
    <button class="back-btn" id="backBtn" onclick="goBack()">← Volver</button>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const answer = urlParams.get('answer');
        let isFromLink = false;

        // Create floating particles
        const particles = document.getElementById('particles');
        const emojis = ['🌹', '💕', '💖', '💗', '💓', '💝', '❤️', '🥀', '🌸', '🌺'];
        
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 12 + 's';
            p.style.animationDuration = (Math.random() * 6 + 10) + 's';
            particles.appendChild(p);
        }

        // Handle URL parameters on page load
        window.addEventListener('DOMContentLoaded', function() {
            if (answer === 'yes') {
                isFromLink = true;
                showResponseIndicator('yes');
                showBackButton();
                sayYes();
            } else if (answer === 'no') {
                isFromLink = true;
                showResponseIndicator('no');
                showBackButton();
                sayNo();
            }
        });

        // Show response indicator when coming from link
        function showResponseIndicator(response) {
            const indicator = document.getElementById('responseIndicator');
            indicator.textContent = response === 'yes' ? '🌹 Respondió SÍ' : '💔 Respondió NO';
            indicator.classList.add('show', response);
        }

        // Show back button when coming from link
        function showBackButton() {
            document.getElementById('backBtn').classList.add('show');
        }

        // Go back to main screen
        function goBack() {
            // Clear URL parameters without reloading
            window.history.pushState({}, document.title, window.location.pathname);
            document.getElementById('flowersScreen').classList.remove('show');
            document.getElementById('errorScreen').classList.remove('show');
            document.getElementById('mainScreen').style.display = 'flex';
            document.getElementById('responseIndicator').classList.remove('show');
            document.getElementById('backBtn').classList.remove('show');
            isFromLink = false;
        }

        // Function to get shareable link
        function getShareableLink(response) {
            const baseUrl = window.location.href.split('?')[0];
            return `${baseUrl}?answer=${response}`;
        }

        // Function to copy link to clipboard
        async function copyLink(response) {
            const link = getShareableLink(response);
            try {
                await navigator.clipboard.writeText(link);
                alert('¡Link copiado al portapapeles! Ahora puedes compartirlo 💕');
            } catch (err) {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = link;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('¡Link copiado al portapapeles! Ahora puedes compartirlo 💕');
            }
        }

        // Real flowers emojis
        const realFlowers = ['🌹', '🌺', '🌸', '🌻', '🌼', '🏵️', '💐', '💮', '🥀', '🌷'];

        // Say yes
        function sayYes() {
            document.getElementById('mainScreen').style.display = 'none';
            document.getElementById('flowersScreen').classList.add('show');
            
            const container = document.getElementById('flowersContainer');
            
            // Create 150 real flowers blooming FAST
            for (let i = 0; i < 150; i++) {
                const flower = document.createElement('div');
                flower.className = 'real-flower';
                flower.innerHTML = realFlowers[Math.floor(Math.random() * realFlowers.length)];
                flower.style.left = Math.random() * 95 + '%';
                flower.style.top = Math.random() * 90 + '%';
                flower.style.fontSize = (Math.random() * 50 + 40) + 'px';
                flower.style.animationDelay = (Math.random() * 3) + 's';
                container.appendChild(flower);
                
                setTimeout(() => flower.classList.add('bloom'), 50);
            }

            // Create 80 floating flowers - appear fast
            const floatContainer = document.getElementById('floatContainer');
            for (let i = 0; i < 80; i++) {
                const f = document.createElement('div');
                f.className = 'flower-float';
                f.innerHTML = realFlowers[Math.floor(Math.random() * realFlowers.length)];
                f.style.left = Math.random() * 95 + '%';
                f.style.top = Math.random() * 90 + '%';
                f.style.fontSize = (Math.random() * 35 + 25) + 'px';
                f.style.animationDelay = Math.random() * 3 + 's';
                floatContainer.appendChild(f);
            }

            // Create 80 magic sparkles - appear fast
            const sparkleContainer = document.getElementById('sparkleContainer');
            for (let i = 0; i < 80; i++) {
                const s = document.createElement('div');
                s.className = 'magic-sparkle';
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 100 + '%';
                s.style.animationDelay = Math.random() * 1 + 's';
                sparkleContainer.appendChild(s);
            }

            // Create 60 falling petals - appear fast
            const petalContainer = document.getElementById('petalContainer');
            const petals = ['🌹', '🌸', '🌺', '🥀', '❤️', '🌷', '💐'];
            for (let i = 0; i < 60; i++) {
                const p = document.createElement('div');
                p.className = 'petal';
                p.innerHTML = petals[Math.floor(Math.random() * petals.length)];
                p.style.left = Math.random() * 95 + '%';
                p.style.animationDelay = Math.random() * 2 + 's';
                p.style.animationDuration = (Math.random() * 3 + 4) + 's';
                petalContainer.appendChild(p);
            }
        }

        // Say no
        function sayNo() {
            document.getElementById('mainScreen').style.display = 'none';
            document.getElementById('errorScreen').classList.add('show');
            
            let count = 10;
            const countdown = document.getElementById('countdown');
            const secLabel = document.getElementById('secLabel');
            
            const timer = setInterval(() => {
                count--;
                countdown.textContent = count;
                if (count === 1) {
                    secLabel.textContent = 'sec';
                }
                if (count <= 0) {
                    clearInterval(timer);
                    // Trigger explosion!
                    triggerExplosion();
                }
            }, 1000);
        }

        // Explosion effect
        function triggerExplosion() {
            const explosion = document.getElementById('explosion');
            const errorScreen = document.getElementById('errorScreen');
            
            // Shake the screen
            document.body.classList.add('shake');
            
            // Show explosion
            explosion.classList.add('show');
            
            // Create explosion particles
            const explosionEmojis = ['💥', '🔥', '☄️', '💣', '⚡', '🌋', '💢', '🧨'];
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'explosion-particle';
                particle.innerHTML = explosionEmojis[Math.floor(Math.random() * explosionEmojis.length)];
                particle.style.left = (window.innerWidth / 2) + 'px';
                particle.style.top = (window.innerHeight / 2) + 'px';
                
                // Random direction
                const angle = (Math.random() * Math.PI * 2);
                const distance = 100 + Math.random() * 200;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                
                explosion.appendChild(particle);
            }
            
            // After explosion, reset
            setTimeout(() => {
                document.body.classList.remove('shake');
                explosion.classList.remove('show');
                countdown.textContent = '10';
                secLabel.textContent = 'secs';
                document.getElementById('errorScreen').classList.remove('show');
                document.getElementById('mainScreen').style.display = 'flex';
                
                // Clear particles
                explosion.innerHTML = '';
            }, 1500);
        }

        // Run away button - makes it VERY hard to click but possible with skill
        function runAway() {
            const btn = document.querySelector('.btn-no');
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            
            // Make the button MUCH smaller and harder to catch
            btn.style.transform = 'scale(0.5)';
            btn.style.transition = 'all 0.08s ease-out';
            btn.style.opacity = '0.7';
            
            // Move to random position - keep it tricky
            // Use almost the entire screen but avoid edges
            const centerX = screenWidth * 0.1 + Math.random() * screenWidth * 0.8;
            const centerY = screenHeight * 0.1 + Math.random() * screenHeight * 0.8;
            
            btn.style.position = 'fixed';
            btn.style.left = centerX + 'px';
            btn.style.top = centerY + 'px';
            btn.style.zIndex = '1000';
            
            // Reset position after 1.5 seconds (very fast reset)
            clearTimeout(btn.runAwayTimeout);
            btn.runAwayTimeout = setTimeout(() => {
                btn.style.position = '';
                btn.style.left = '';
                btn.style.top = '';
                btn.style.zIndex = '';
                btn.style.transform = '';
                btn.style.opacity = '';
            }, 1500);
        }
        
        // Reset button position when clicking elsewhere
        document.addEventListener('click', function(e) {
            if (!e.target.classList.contains('btn-no')) {
                const btn = document.querySelector('.btn-no');
                btn.style.position = '';
                btn.style.left = '';
                btn.style.top = '';
                btn.style.zIndex = '';
            }
        });
    </script>
</body>
</html>
