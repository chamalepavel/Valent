<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quieres ser mi Valentine? 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            font-family: Georgia, serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            color: #c21e57;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }

        .heart {
            font-size: 4rem;
            animation: beat 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .buttons {
            margin-top: 40px;
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
        }

        .btn {
            padding: 15px 50px;
            font-size: 1.3rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: Georgia, serif;
        }

        .btn-yes {
            background: linear-gradient(45deg, #ff6b6b, #c21e57);
            color: white;
            box-shadow: 0 4px 15px rgba(194, 30, 87, 0.4);
        }

        .btn-yes:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(194, 30, 87, 0.6);
        }

        .btn-no {
            background: linear-gradient(45deg, #a8a8a8, #666);
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-no:hover {
            background: linear-gradient(45deg, #ff6b6b, #c21e57);
        }

        .flower-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a8edea 100%);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .message {
            font-size: 2.5rem;
            color: #c21e57;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            animation: fadeInUp 1s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stem {
            width: 8px;
            height: 0;
            background: linear-gradient(to top, #228b22, #32cd32);
            border-radius: 4px;
            position: relative;
            animation: grow 2s ease forwards;
        }

        @keyframes grow {
            to { height: 200px; }
        }

        .leaf {
            position: absolute;
            width: 40px;
            height: 25px;
            background: linear-gradient(45deg, #228b22, #32cd32);
            border-radius: 50% 0 50% 0;
            opacity: 0;
            animation: leafGrow 1s ease 1.5s forwards;
        }

        .leaf.left {
            left: -40px;
            top: 50%;
            transform: rotate(-30deg);
        }

        .leaf.right {
            right: -40px;
            top: 50%;
            transform: rotate(30deg) scaleX(-1);
        }

        @keyframes leafGrow {
            to { opacity: 1; }
        }

        .flower-head {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            animation: bloom 1.5s ease 2s forwards;
        }

        @keyframes bloom {
            0% { transform: translateX(-50%) scale(0); }
            50% { transform: translateX(-50%) scale(1.3); }
            100% { transform: translateX(-50%) scale(1); }
        }

        .petal {
            position: absolute;
            width: 35px;
            height: 50px;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            border-radius: 50% 50% 50% 50%;
            transform-origin: center bottom;
            box-shadow: inset -2px -2px 10px rgba(0,0,0,0.1);
        }

        .petal:nth-child(1) { transform: rotate(0deg) translateY(-25px); }
        .petal:nth-child(2) { transform: rotate(45deg) translateY(-25px); }
        .petal:nth-child(3) { transform: rotate(90deg) translateY(-25px); }
        .petal:nth-child(4) { transform: rotate(135deg) translateY(-25px); }
        .petal:nth-child(5) { transform: rotate(180deg) translateY(-25px); }
        .petal:nth-child(6) { transform: rotate(225deg) translateY(-25px); }
        .petal:nth-child(7) { transform: rotate(270deg) translateY(-25px); }
        .petal:nth-child(8) { transform: rotate(315deg) translateY(-25px); }

        .center {
            position: absolute;
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .flowers-wrapper {
            display: flex;
            gap: 40px;
            align-items: flex-end;
        }

        .flower-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 50;
        }

        .floating-heart {
            position: absolute;
            font-size: 2rem;
            animation: floatUp 4s ease-in-out infinite;
            opacity: 0.7;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .share-btn {
            margin-top: 40px;
            padding: 15px 40px;
            font-size: 1.2rem;
            background: #25D366;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            animation: pulse 2s infinite;
            font-family: Georgia, serif;
        }

        .share-btn:hover {
            background: #128C7E;
            transform: scale(1.05);
        }

        .confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 200;
        }

        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            animation: confettiFall 3s ease-out forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="floatingHearts"></div>

    <div class="container" id="mainContainer">
        <div class="heart">💕</div>
        <h1>¿Quieres ser mi Valentine?</h1>
        <div class="buttons">
            <button class="btn btn-yes" onclick="showFlowers()">Sí 💖</button>
            <button class="btn btn-no" id="noBtn">No 😢</button>
        </div>
    </div>

    <div class="flower-container" id="flowerContainer">
        <div class="message">¡Sabía que dirías que sí! 💕</div>
        <div class="flowers-wrapper">
            <div class="flower-wrapper">
                <div class="stem">
                    <div class="leaf left"></div>
                    <div class="leaf right"></div>
                    <div class="flower-head">
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="center"></div>
                    </div>
                </div>
            </div>
            <div class="flower-wrapper">
                <div class="stem" style="animation-delay: 0.3s;">
                    <div class="leaf left"></div>
                    <div class="leaf right"></div>
                    <div class="flower-head" style="animation-delay: 2.3s;">
                        <div class="petal" style="background: linear-gradient(135deg, #ff8c00, #ff4500);"></div>
                        <div class="petal" style="background: linear-gradient(135deg, #ff8c00, #ff4500);"></div>
                        <div class="petal" style="background: linear-gradient(135deg, #ff8c00, #ff4500);"></div>
                        <div class="petal" style="background: linear-gradient(135deg, #ff8c00, #ff4500);"></div>
                        <div class="petal" style="background: linear-gradient(135deg, #ff8c00, #ff4500);"></div>
                        <div class="petal" style="background: linear-gradient(135deg, #ff8c00, #ff4500);"></div>
                        <div class="petal" style="background: linear-gradient(135deg, #ff8c00, #ff4500);"></div>
                        <div class="petal" style="background: linear-gradient(135deg, #ff8c00, #ff4500);"></div>
                        <div class="center" style="background: linear-gradient(135deg, #ff6347, #ff4500);"></div>
                    </div>
                </div>
            </div>
            <div class="flower-wrapper">
                <div class="stem" style="animation-delay: 0.6s;">
                    <div class="leaf left"></div>
                    <div class="leaf right"></div>
                    <div class="flower-head" style="animation-delay: 2.6s;">
                        <div class="petal" style="background: linear-gradient(135deg, #9370db, #8a2be2);"></div>
                        <div class="petal" style="background: linear-gradient(135deg, #9370db, #8a2be2);"></div>
                        <div class="petal" style="background: linear-gradient(135deg, #9370db, #8a2be2);"></div>
                        <div class="petal" style="background: linear-gradient(135deg, #9370db, #8a2be2);"></div>
                        <div class="petal" style="background: linear-gradient(135deg, #9370db, #8a2be2);"></div>
                        <div class="petal" style="background: linear-gradient(135deg, #9370db, #8a2be2);"></div>
                        <div class="petal" style="background: linear-gradient(135deg, #9370db, #8a2be2);"></div>
                        <div class="petal" style="background: linear-gradient(135deg, #9370db, #8a2be2);"></div>
                        <div class="center" style="background: linear-gradient(135deg, #da70d6, #ba55d3);"></div>
                    </div>
                </div>
            </div>
        </div>
        <button class="share-btn" id="shareBtn" onclick="shareOnWhatsApp()">
            Compartir por WhatsApp
        </button>
    </div>

    <div class="confetti" id="confetti"></div>

    <script>
        var noBtn = document.getElementById("noBtn");
        
        noBtn.addEventListener("mouseover", function() {
            var x = Math.random() * (window.innerWidth - this.offsetWidth);
            var y = Math.random() * (window.innerHeight - this.offsetHeight);
            this.style.position = "fixed";
            this.style.left = x + "px";
            this.style.top = y + "px";
        });

        noBtn.addEventListener("click", function() {
            this.innerHTML = "No importa, di que sí 💕";
            this.style.background = "linear-gradient(45deg, #ff6b6b, #c21e57)";
        });

        function showFlowers() {
            document.getElementById("mainContainer").style.display = "none";
            document.getElementById("flowerContainer").style.display = "flex";
            createConfetti();
            setTimeout(function() {
                document.getElementById("shareBtn").style.display = "block";
            }, 4000);
        }

        function createFloatingHearts() {
            var container = document.getElementById("floatingHearts");
            var hearts = ["💕", "💖", "💗", "💓", "💝", "❤️"];
            
            for (var i = 0; i < 15; i++) {
                var heart = document.createElement("div");
                heart.className = "floating-heart";
                heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = (Math.random() * 100) + "%";
                heart.style.animationDelay = (Math.random() * 4) + "s";
                heart.style.animationDuration = (4 + Math.random() * 2) + "s";
                container.appendChild(heart);
            }
        }

        function createConfetti() {
            var container = document.getElementById("confetti");
            var colors = ["#ff6b6b", "#ffd700", "#ff69b4", "#32cd32", "#9370db", "#ff8c00"];
            
            for (var i = 0; i < 100; i++) {
                var confetti = document.createElement("div");
                confetti.className = "confetti-piece";
                confetti.style.left = (Math.random() * 100) + "%";
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = (Math.random() * 2) + "s";
                var size = 5 + Math.random() * 10;
                confetti.style.width = size + "px";
                confetti.style.height = size + "px";
                container.appendChild(confetti);
            }
        }

        function shareOnWhatsApp() {
            var url = window.location.href;
            var message = "Aceptaste ser mi Valentine! Mira esta pagina especial: " + url;
            var whatsappUrl = "https://wa.me/?text=" + encodeURIComponent(message);
            window.open(whatsappUrl, "_blank");
        }

        createFloatingHearts();
    </script>
</body>
</html>
